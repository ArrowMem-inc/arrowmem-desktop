[package]
name = "packanswer"
version = "0.1.0"
edition = "2021"
description = "Reference only offline pack answering: returns verbatim pack records with their source, never authored text. No network, no writes."
publish = false

[dependencies]
arrowbridge = { path = "../arrowbridge" }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
libc = "0.2"
