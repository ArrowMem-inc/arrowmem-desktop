[package]
name = "arrowmem-desktop"
version = "0.1.0"
edition = "2021"
description = "ArrowMem home machine app (scaffold)"

[lib]
name = "arrowmem_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "2"
qrcode = { version = "0.14.1", default-features = false }
tauri-plugin-dialog = { version = "=2.8.4", default-features = false, features = ["gtk3"] }

[dev-dependencies]
socket2 = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# sha256 over a multi-GB model in an unoptimised dependency took over 19 minutes; optimise deps in dev builds.
[profile.dev.package."*"]
opt-level = 3
