[package]
name = "arrowmem-desktop"
version = "0.1.1"
edition = "2021"
description = "ArrowMem home machine app (scaffold)"

[lib]
name = "arrowmem_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# The Tauri template feature. Without it tauri-build treats the build as a dev build and the generated context embeds the manifest folder as a string.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# The sealed channel client (RULINGS ADD 826 b, the four crates waived by name, pinned to the versions the companion's Rust lock holds).
hmac = "=0.12.1"
hkdf = "=0.12.4"
aes-gcm = "=0.10.3"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
ureq = "2"
qrcode = { version = "0.14.1", default-features = false }
tauri-plugin-dialog = { version = "=2.8.4", default-features = false, features = ["gtk3"] }

[dev-dependencies]
socket2 = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# sha256 over a multi-GB model in an unoptimised dependency took over 19 minutes; optimise deps in dev builds.
[profile.dev.package."*"]
opt-level = 3
